global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service: tayar-ai

rule_files:
  - /etc/prometheus/rules/tayar-alerts.yml

scrape_configs:
  - job_name: tayar-ai-api
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - tayar-ai-api.onrender.com
        labels:
          service: tayar-ai-api
          environment: production
