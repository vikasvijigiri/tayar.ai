name: Deployed API Smoke Tests
on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/requirements.txt"
      - "backend/supabase/schema.sql"
      - "render.yaml"
      - ".github/workflows/deployed-api-smoke.yml"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: deployed-api-smoke-main
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render health endpoint
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$API_BASE_URL/health" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP $code; retrying..."
            sleep 15
          done
          echo "Live API health check did not pass."
          exit 1

      - name: Verify config and Prometheus metrics
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          curl --fail --silent --show-error "$API_BASE_URL/v1/config" | tee /tmp/config.json
          grep -q '"rrb_ntpc"' /tmp/config.json
          curl --fail --silent --show-error "$API_BASE_URL/metrics" | tee /tmp/metrics.txt
          grep -q 'tayar_http_requests_total' /tmp/metrics.txt
          grep -q 'tayar_http_request_duration_seconds' /tmp/metrics.txt

      - name: Verify protected endpoints reject anonymous requests
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          wait_get_status() {
            path="$1"
            expected="$2"
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' "$API_BASE_URL$path" || true)
              echo "$path attempt $attempt returned HTTP $code (expected $expected)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 15
            done
            return 1
          }
          wait_post_status() {
            path="$1"
            body="$2"
            expected="$3"
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' -X POST -H "Content-Type: application/json" -d "$body" "$API_BASE_URL$path" || true)
              echo "$path attempt $attempt returned HTTP $code (expected $expected)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 15
            done
            return 1
          }
          wait_get_status "/v1/attempts/summary" "401"
          wait_post_status "/v1/ai/hint" '{"question_id":"00000000-0000-0000-0000-000000000001","hint_level":"nudge"}' "401"
          wait_post_status "/v1/questions/00000000-0000-0000-0000-000000000001/answer" '{"answer_given":"A","elapsed_ms":1000}' "401"

      - name: Verify Supabase-backed readiness and verified question delivery
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' "$API_BASE_URL/health/ready" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ready"' /tmp/readiness.json; then
              ready=true
              break
            fi
            if grep -q '"missing_configuration"' /tmp/readiness.json; then
              cat /tmp/readiness.json
              echo "Supabase environment variables are missing in Render. Configure SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY, then redeploy."
              exit 1
            fi
            echo "Readiness attempt $attempt returned HTTP $code; waiting for deploy/configuration..."
            sleep 15
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/readiness.json
            echo "Supabase-backed readiness did not pass. Check Render environment variables and deploy status."
            exit 1
          fi
          questions_ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/questions.json -w '%{http_code}' "$API_BASE_URL/v1/questions?exam_id=rrb_ntpc&limit=1&offset=0" || true)
            if [ "$code" = "200" ] && grep -q '"questions"' /tmp/questions.json; then
              questions_ready=true
              break
            fi
            echo "Question API attempt $attempt returned HTTP $code; waiting for deploy/configuration..."
            sleep 15
          done
          if [ "$questions_ready" != "true" ]; then
            cat /tmp/questions.json
            echo "Verified question service is not ready. Check SUPABASE_SERVICE_ROLE_KEY and database schema."
            exit 1
          fi
          if grep -q '"answer_key"' /tmp/questions.json; then
            echo "Security failure: question-list response exposed answer_key."
            exit 1
          fi
