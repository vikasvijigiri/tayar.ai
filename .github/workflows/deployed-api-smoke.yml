name: Deployed API Smoke Tests
on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/requirements.txt"
      - "backend/supabase/schema.sql"
      - "backend/supabase/seed_verified_math.sql"
      - "backend/supabase/seed_verified_math_expansion.sql"
      - "backend/supabase/seed_verified_math_expansion_12.sql"
      - "backend/supabase/seed_assertions.sql"
      - "render.yaml"
      - ".github/workflows/deployed-api-smoke.yml"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: deployed-api-smoke-main
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Render health endpoint
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$API_BASE_URL/health" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health check attempt $attempt returned HTTP $code; retrying..."
            sleep 15
          done
          echo "Live API health check did not pass."
          exit 1

      - name: Verify config and Prometheus metrics
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          curl --fail --silent --show-error "$API_BASE_URL/v1/config" | tee /tmp/config.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/config.json").read_text())
          exams = payload.get("supported_exams")
          metrics = payload.get("adaptive_metrics")
          if not isinstance(exams, list) or not any(isinstance(exam, dict) and exam.get("id") == "rrb_ntpc" for exam in exams):
              raise SystemExit("Config returned HTTP 200 without the RRB NTPC exam contract")
          required = {"overall_accuracy", "last_5_accuracy", "weakness", "retention", "time_efficiency"}
          if not isinstance(metrics, list) or not required.issubset(set(metrics)):
              raise SystemExit("Config returned HTTP 200 without required adaptive metrics")
          if not isinstance(payload.get("supabase_url"), str) or not payload["supabase_url"].startswith("https://"):
              raise SystemExit("Config returned HTTP 200 without a valid Supabase URL")
          if not isinstance(payload.get("supabase_anon_key"), str) or not payload["supabase_anon_key"]:
              raise SystemExit("Config returned HTTP 200 without the public Supabase auth key")
          print("Config contract passed: exam, adaptive metrics and authentication configuration.")
          PY
          curl --fail --silent --show-error "$API_BASE_URL/metrics" | tee /tmp/metrics.txt
          grep -q 'tayar_http_requests_total' /tmp/metrics.txt
          grep -q 'tayar_http_request_duration_seconds' /tmp/metrics.txt

      - name: Verify protected endpoints reject anonymous requests
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          wait_get_status() {
            path="$1"
            expected="$2"
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' "$API_BASE_URL$path" || true)
              echo "$path attempt $attempt returned HTTP $code (expected $expected)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 15
            done
            return 1
          }
          wait_post_status() {
            path="$1"
            body="$2"
            expected="$3"
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' -X POST -H "Content-Type: application/json" -d "$body" "$API_BASE_URL$path" || true)
              echo "$path attempt $attempt returned HTTP $code (expected $expected)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 15
            done
            return 1
          }
          wait_get_status "/v1/attempts/summary" "401"
          wait_get_status "/v1/attempts/history?exam_id=rrb_ntpc" "401"
          wait_post_status "/v1/ai/hint" '{"question_id":"00000000-0000-0000-0000-000000000001","hint_level":"nudge"}' "401"
          wait_post_status "/v1/questions/00000000-0000-0000-0000-000000000001/answer" '{"answer_given":"A","elapsed_ms":1000}' "401"
          wait_post_status "/v1/attempts/preview" '{"question_id":"demo","topic_id":"percentages","is_correct":false,"elapsed_ms":1000}' "404"
          wait_get_status "/v1/questions?exam_id=unsupported" "422"
          wait_get_status "/v1/attempts/summary?exam_id=unsupported" "422"
          wait_get_status "/v1/attempts/history?exam_id=unsupported" "422"
          cors_code=$(curl -sS -o /tmp/cors.txt -w '%{http_code}' -X OPTIONS "$API_BASE_URL/v1/questions" -H "Origin: https://untrusted.example" -H "Access-Control-Request-Method: GET" || true)
          if [ "$cors_code" != "400" ] || grep -qi 'access-control-allow-origin' /tmp/cors.txt; then
            echo "Untrusted CORS origin was not rejected safely (HTTP $cors_code)."
            cat /tmp/cors.txt
            exit 1
          fi

      - name: Verify Supabase-backed readiness and verified question delivery
        env:
          API_BASE_URL: https://tayar-ai-api.onrender.com
        run: |
          ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/readiness.json -w '%{http_code}' "$API_BASE_URL/health/ready" || true)
            if [ "$code" = "200" ] && grep -q '"status":"ready"' /tmp/readiness.json; then
              ready=true
              break
            fi
            if grep -q '"missing_configuration"' /tmp/readiness.json; then
              cat /tmp/readiness.json
              echo "Supabase environment variables are missing in Render. Configure SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY, then redeploy."
              exit 1
            fi
            echo "Readiness attempt $attempt returned HTTP $code; waiting for deploy/configuration..."
            sleep 15
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/readiness.json
            echo "Supabase-backed readiness did not pass. Check Render environment variables and deploy status."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/readiness.json").read_text())
          dependencies = payload.get("dependencies")
          if payload.get("status") != "ready" or not isinstance(dependencies, dict):
              raise SystemExit("Readiness returned HTTP 200 without a valid readiness contract")
          if dependencies.get("supabase") != "connected" or dependencies.get("question_bank") != "available":
              raise SystemExit(f"Readiness returned HTTP 200 but a critical dependency is unhealthy: {dependencies!r}")
          print("Readiness contract passed: Supabase and active verified question bank are available.")
          PY
          questions_ready=false
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/questions.json -w '%{http_code}' "$API_BASE_URL/v1/questions?exam_id=rrb_ntpc&limit=1&offset=0" || true)
            if [ "$code" = "200" ] && grep -q '"questions"' /tmp/questions.json; then
              questions_ready=true
              break
            fi
            echo "Question API attempt $attempt returned HTTP $code; waiting for deploy/configuration..."
            sleep 15
          done
          if [ "$questions_ready" != "true" ]; then
            cat /tmp/questions.json
            echo "Verified question service is not ready. Check SUPABASE_SERVICE_ROLE_KEY and database schema."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/questions.json").read_text())
          questions = payload.get("questions")
          total_count = payload.get("total_count")
          if not isinstance(questions, list) or len(questions) != 1:
              raise SystemExit("Expected exactly one question in the smoke-test page")
          if not isinstance(total_count, int) or total_count < 50:
              raise SystemExit(f"Expected at least 50 live verified questions, got {total_count!r}")
          if any("answer_key" in question for question in questions):
              raise SystemExit("Security failure: question-list response exposed answer_key")
          if not questions[0].get("source_document") or not questions[0].get("source_page"):
              raise SystemExit("Question response is missing source attribution")
          print(f"Live question API passed: {total_count} verified questions; answer keys hidden.")
          PY
