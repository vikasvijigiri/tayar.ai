name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit backend dependencies and generate CycloneDX SBOM
        shell: bash
        run: |
          set +e
          pip-audit -r backend/requirements-dev.txt
          audit_status=$?
          pip-audit -r backend/requirements-dev.txt --format cyclonedx-json --output backend-sbom.cdx.json
          sbom_status=$?
          if [[ "$audit_status" -ne 0 || "$sbom_status" -ne 0 ]]; then
            exit 1
          fi
      - name: Retain backend SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayar-backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Generate mobile CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application > mobile-sbom.cdx.json
      - name: Audit all JavaScript dependencies (including development tooling)
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          audit_status=$?
          cat npm-audit-report.json
          python ../.github/scripts/check_npm_audit_exceptions.py --report npm-audit-report.json --exceptions security-exceptions.json --lockfile package-lock.json
          policy_status=$?
          if [[ "$audit_status" -ne 0 || "$policy_status" -ne 0 ]]; then
            exit 1
          fi
      - name: Retain npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            mobile/npm-audit-report.json
            mobile/mobile-sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL static analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Gitleaks repository and change scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
