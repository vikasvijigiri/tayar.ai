name: Dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
permissions:
  contents: read
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements-dev.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=critical
