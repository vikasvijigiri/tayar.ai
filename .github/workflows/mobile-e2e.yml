name: Mobile E2E

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
      - ".devcontainer/**"
      - "mobile/QA.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
      - ".devcontainer/**"
      - "mobile/QA.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    env:
      # Make TCG visible to both the emulator action and its child emulator process.
      ANDROID_I_WANT_MY_TCG: "yes"
    name: Android emulator UI regression
    # Never expose test credentials to fork-originated pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build x86_64 debug APK
        working-directory: mobile
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug -PreactNativeArchitectures=x86_64

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro flows on hosted Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel off
          script: |
            set -e
            mkdir -p qa-artifacts
            trap 'adb logcat -d -v time 2>/dev/null | grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|tayar" > qa-artifacts/android-crash-diagnostics.log || true; adb exec-out screencap -p > qa-artifacts/final-screen.png 2>/dev/null || true' EXIT
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test --format junit --output qa-artifacts/smoke.xml .maestro/smoke.yaml
            maestro test --format junit --output qa-artifacts/auth-validation.xml .maestro/auth-validation.yaml
            if [ -n "${TEST_PHONE:-}" ] && [ -n "${TEST_OTP:-}" ]; then
              maestro test --format junit --output qa-artifacts/authenticated-navigation.xml -e TEST_PHONE="$TEST_PHONE" -e TEST_OTP="$TEST_OTP" .maestro/authenticated-navigation.yaml
            else
              echo "Authenticated journey skipped: configure TEST_PHONE and TEST_OTP using a dedicated non-production Supabase test project." >> "$GITHUB_STEP_SUMMARY"
            fi

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayar-android-emulator-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
