name: Mobile E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud:
    name: Android UI regression (Maestro Cloud)
    # Never expose repository secrets to fork-originated pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          adb version

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Generate Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build x86_64-compatible debug APK for Maestro Cloud
        working-directory: mobile
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug -PreactNativeArchitectures=x86_64

      - name: Detect configured QA credentials
        id: qa_config
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          MAESTRO_PROJECT_ID: ${{ secrets.MAESTRO_PROJECT_ID }}
          TEST_PHONE: ${{ secrets.TEST_PHONE }}
          TEST_OTP: ${{ secrets.TEST_OTP }}
        run: |
          if [[ -n "$MAESTRO_CLOUD_API_KEY" && -n "$MAESTRO_PROJECT_ID" ]]; then
            echo "cloud_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$TEST_PHONE" && -n "$TEST_OTP" ]]; then
            echo "auth_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "auth_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain missing Maestro Cloud configuration
        if: ${{ steps.qa_config.outputs.cloud_enabled != 'true' }}
        run: |
          echo "Maestro Cloud execution skipped. Add MAESTRO_CLOUD_API_KEY and MAESTRO_PROJECT_ID in repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Run public smoke and input-validation flows
        if: ${{ steps.qa_config.outputs.cloud_enabled == 'true' }}
        id: maestro_smoke
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          workspace: .maestro
          include-tags: smoke
          device-model: pixel_7
          device-os: android-34
          timeout: 45

      - name: Run authenticated navigation flow
        if: ${{ steps.qa_config.outputs.cloud_enabled == 'true' && steps.qa_config.outputs.auth_enabled == 'true' }}
        id: maestro_authenticated
        uses: mobile-dev-inc/action-maestro-cloud@v3.0.1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          workspace: .maestro
          include-tags: authenticated
          device-model: pixel_7
          device-os: android-34
          timeout: 45
          env: |
            TEST_PHONE=${{ secrets.TEST_PHONE }}
            TEST_OTP=${{ secrets.TEST_OTP }}

      - name: Explain skipped authenticated suite
        if: ${{ steps.qa_config.outputs.auth_enabled != 'true' }}
        run: |
          echo "Authenticated navigation flow skipped. Configure TEST_PHONE and TEST_OTP using a dedicated Supabase test project with a fixed test OTP." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Maestro Cloud report links
        if: always()
        env:
          SMOKE_URL: ${{ steps.maestro_smoke.outputs.MAESTRO_CLOUD_CONSOLE_URL }}
          AUTH_URL: ${{ steps.maestro_authenticated.outputs.MAESTRO_CLOUD_CONSOLE_URL }}
          SMOKE_STATUS: ${{ steps.maestro_smoke.outputs.MAESTRO_CLOUD_UPLOAD_STATUS }}
          AUTH_STATUS: ${{ steps.maestro_authenticated.outputs.MAESTRO_CLOUD_UPLOAD_STATUS }}
        run: |
          {
            echo "## Maestro Cloud"
            echo "- Smoke status: ${SMOKE_STATUS:-not run}"
            echo "- Smoke report: ${SMOKE_URL:-not available}"
            echo "- Authenticated status: ${AUTH_STATUS:-not run}"
            echo "- Authenticated report: ${AUTH_URL:-not available}"
          } >> "$GITHUB_STEP_SUMMARY"
