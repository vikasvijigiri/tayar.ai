name: Mobile E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".maestro/**"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-cloud:
    name: Android UI regression (Maestro Cloud)
    # Repository secrets are unavailable to fork PRs. Do not expose test credentials to forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: npx expo install --check

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK for cloud UI testing
        working-directory: mobile
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleDebug

      - name: Run Maestro flows in cloud
        id: maestro
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          workspace: .maestro
          timeout: 45

      - name: Publish Maestro run link
        if: always()
        env:
          CONSOLE_URL: ${{ steps.maestro.outputs.MAESTRO_CLOUD_CONSOLE_URL }}
        run: |
          if [ -n "${CONSOLE_URL:-}" ]; then
            echo "Maestro Cloud report: ${CONSOLE_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Maestro Cloud did not return a console URL. Check the action logs." >> "$GITHUB_STEP_SUMMARY"
          fi
