name: Android Emulator QA

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-emulator-qa.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-emulator-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    name: Android ${{ matrix.api }} · ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_2
          - api: 35
            profile: pixel_6
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies and validate app
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npx expo config --type public
          npm run typecheck
          npm test

      - name: Generate Android project and build release APK
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease

      - name: Boot emulator and run adaptive UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell settings put system font_scale 1.30
            adb shell monkey -p ai.tayar.adaptive 1
            sleep 25
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'ai.tayar.adaptive'
            adb logcat -d -t 5000 > /tmp/tayar-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: ai.tayar.adaptive' /tmp/tayar-logcat.txt | grep -q 'FATAL EXCEPTION'; then
              cat /tmp/tayar-logcat.txt
              exit 1
            fi
            adb shell uiautomator dump /sdcard/tayar-window.xml >/dev/null
            adb pull /sdcard/tayar-window.xml /tmp/tayar-window.xml
            python - <<'PY'
            import xml.etree.ElementTree as ET
            from pathlib import Path
            import re

            root = ET.parse("/tmp/tayar-window.xml").getroot()
            nodes = list(root.iter("node"))
            visible = " ".join(
                " ".join((node.attrib.get("text", ""), node.attrib.get("content-desc", "")))
                for node in nodes
            )
            required = ["TAYAR", "Continue with Google", "Phone number with country code"]
            missing = [label for label in required if label.casefold() not in visible.casefold()]
            if missing:
                raise SystemExit(f"Login UI is missing accessible/visible elements: {missing}; hierarchy={visible[:2000]!r}")

            clickable = [node for node in nodes if node.attrib.get("clickable") == "true"]
            if not clickable:
                raise SystemExit("No clickable controls were exposed to Android UIAutomator")
            density_text = Path("/tmp/tayar-density.txt")
            density_text.write_text("")
            print(f"Visible login contract passed; {len(clickable)} clickable controls found at 130% font scale.")

            for node in clickable:
                bounds = node.attrib.get("bounds", "")
                match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                if not match:
                    continue
                left, top, right, bottom = map(int, match.groups())
                if right <= left or bottom <= top:
                    raise SystemExit(f"Invalid clickable bounds: {bounds}")
            print("All clickable controls have non-zero UI bounds.")
            PY
            adb shell input keyevent 4
            adb shell am force-stop ai.tayar.adaptive
            echo "PASS Android emulator boot, install, launch, crash check and accessible login UI at 130% font scale."
