name: Android Responsive UI Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-responsive-matrix.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-responsive-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive-smoke:
    name: Android ${{ matrix.api }} · ${{ matrix.profile }} · 130% font
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            profile: pixel_2
            resolution: 320x720
          - api: 35
            profile: pixel_6
            resolution: 480x960
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK and KVM
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/platform-tools/adb"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -e /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Install and validate mobile app
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npx expo config --type public
          npm run typecheck
          npm test
          npx expo prebuild --platform android --non-interactive

      - name: Build release APK for x86_64 emulator
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain assembleRelease -PreactNativeArchitectures=x86_64

      - name: Boot emulator and verify responsive/accessibility contract
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2 -partition-size 2048
          script: |
            set -euo pipefail
            set -x
            mkdir -p qa-artifacts
            echo "MARKER: configure emulator display and accessibility scale"
            adb shell input keyevent 82 || true
            adb shell settings put system screen_off_timeout 1800000
            adb shell wm size ${{ matrix.resolution }}
            adb shell wm density 160
            adb shell settings put system font_scale 1.30
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            echo "MARKER: install and launch app"
            adb shell monkey -p ai.tayar.adaptive 1
            sleep 20
            activity_dump=$(timeout 30s adb shell dumpsys activity activities)
            printf '%s\n' "$activity_dump" | grep -E 'mResumedActivity|topResumedActivity' | grep -F 'ai.tayar.adaptive' >/dev/null
            adb logcat -d -t 5000 > qa-artifacts/android-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: ai.tayar.adaptive' qa-artifacts/android-logcat.txt | grep -q 'FATAL EXCEPTION'; then
              cat qa-artifacts/android-logcat.txt
              exit 1
            fi
            echo "MARKER: collect accessibility hierarchy"
            timeout 45s adb shell uiautomator dump --compressed /sdcard/tayar-window.xml >/dev/null
            timeout 30s adb pull /sdcard/tayar-window.xml qa-artifacts/ui-hierarchy.xml
            echo "MARKER: collect screenshot"
            timeout 30s adb shell screencap -p /sdcard/tayar-screen.png
            timeout 30s adb pull /sdcard/tayar-screen.png qa-artifacts/final-screen.png
            density=$(adb shell wm density | awk -F': ' '/Override density/ {print $2; found=1} /Physical density/ {physical=$2} END {if (!found) print physical}')
            export ANDROID_DENSITY="$density"
            export ANDROID_API_LEVEL="${{ matrix.api }}"
            export ANDROID_RESOLUTION="${{ matrix.resolution }}"
            echo "MARKER: evaluate accessibility and touch-target contract"
            timeout 30s python - <<'PY'
            import os
            import re
            import xml.etree.ElementTree as ET

            root = ET.parse("qa-artifacts/ui-hierarchy.xml").getroot()
            nodes = list(root.iter("node"))

            def node_text(node):
                return " ".join(
                    node.attrib.get(key, "")
                    for key in ("text", "content-desc", "hint")
                )

            visible = " ".join(node_text(node) for node in nodes)
            required = ["TAYAR", "Continue with Google"]
            missing = [label for label in required if label.casefold() not in visible.casefold()]
            if missing:
                raise SystemExit(f"Login UI missing visible/accessibility text: {missing}")

            edit_fields = [
                node for node in nodes
                if node.attrib.get("class") == "android.widget.EditText"
            ]
            if not edit_fields:
                raise SystemExit("Phone input is not exposed as an accessible Android EditText")

            clickable = [node for node in nodes if node.attrib.get("clickable") == "true"]

            def descendants_text(node):
                values = []
                for descendant in node.iter("node"):
                    value = node_text(descendant).strip()
                    if value and value not in values:
                        values.append(value)
                return " ".join(values)

            density = int(os.environ.get("ANDROID_DENSITY", "0"))
            if density <= 0:
                raise SystemExit("Could not read effective emulator density")

            for label in ("Continue with Google", "Continue"):
                candidates = [
                    node for node in clickable
                    if descendants_text(node).strip().casefold() == label.casefold()
                ]
                if not candidates:
                    raise SystemExit(f"Could not locate clickable control for {label!r}")
                bounds = candidates[0].attrib.get("bounds", "")
                match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
                if not match:
                    raise SystemExit(f"Invalid clickable bounds for {label!r}: {bounds}")
                left, top, right, bottom = map(int, match.groups())
                width_dp = (right - left) * 160 / density
                height_dp = (bottom - top) * 160 / density
                if width_dp < 48 or height_dp < 48:
                    raise SystemExit(
                        f"{label!r} touch target is too small: {width_dp:.1f}x{height_dp:.1f} dp"
                    )

            with open("qa-artifacts/android-properties.txt", "w", encoding="utf-8") as output:
                output.write(
                    f"api={os.environ['ANDROID_API_LEVEL']}\n"
                    f"resolution={os.environ['ANDROID_RESOLUTION']}\n"
                    f"font_scale=1.30\n"
                    f"density={density}\n"
                    f"clickable_controls={len(clickable)}\n"
                )
            print(
                f"Responsive login contract passed on API {os.environ['ANDROID_API_LEVEL']} "
                f"at 130% font scale; {len(clickable)} clickable controls exposed; "
                "both primary touch targets meet 48dp."
            )
            PY

      - name: Upload responsive emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tayar-responsive-api-${{ matrix.api }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
