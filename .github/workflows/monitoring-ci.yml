name: Monitoring Config CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoring-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate monitoring configuration and dashboard
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          root = Path(".")
          prometheus = yaml.safe_load((root / "monitoring/prometheus.yml").read_text())
          alerts = yaml.safe_load((root / "monitoring/alerts.yml").read_text())
          compose = yaml.safe_load((root / "monitoring/docker-compose.yml").read_text())
          blackbox = yaml.safe_load((root / "monitoring/blackbox.yml").read_text())
          datasource = yaml.safe_load((root / "monitoring/grafana/provisioning/datasources/prometheus.yml").read_text())
          provider = yaml.safe_load((root / "monitoring/grafana/provisioning/dashboards/provider.yml").read_text())
          dashboard = json.loads((root / "monitoring/grafana/tayar-api-reliability.json").read_text())

          jobs = {job["job_name"]: job for job in prometheus["scrape_configs"]}
          assert prometheus["rule_files"] == ["/etc/prometheus/alerts.yml"]
          assert "tayar-ai-api-metrics" in jobs
          assert jobs["tayar-ai-api-metrics"]["metrics_path"] == "/metrics"
          assert "tayar-ai-api.onrender.com" in jobs["tayar-ai-api-metrics"]["static_configs"][0]["targets"]
          assert "tayar-ai-api-liveness" in jobs
          assert "tayar-ai-api-readiness" in jobs
          assert "blackbox-exporter" in compose["services"]
          assert "prometheus" in compose["services"] and "grafana" in compose["services"]
          assert "http_2xx" in blackbox["modules"]
          assert datasource["datasources"][0]["uid"] == "prometheus"
          assert provider["providers"]
          assert dashboard["uid"] == "tayar-api-reliability"
          assert len(dashboard["panels"]) >= 6
          all_queries = " ".join(target.get("expr", "") for panel in dashboard["panels"] for target in panel.get("targets", []))
          assert "tayar_http_requests_total" in all_queries
          assert "tayar_http_request_duration_seconds_bucket" in all_queries
          assert "tayar_ai_provider_requests_total" in all_queries
          assert "tayar_ai_provider_request_duration_seconds_bucket" in all_queries
          assert "probe_success" in all_queries
          alert_names = {rule["alert"] for group in alerts["groups"] for rule in group["rules"]}
          assert {"TayarApiMetricsTargetDown", "TayarApiLivenessFailed", "TayarApiReadinessFailed", "TayarApiHigh5xxRate", "TayarApiHighP95Latency"} <= alert_names
          assert "./alerts.yml:/etc/prometheus/alerts.yml:ro" in (root / "monitoring/docker-compose.yml").read_text()
          print("Monitoring config valid: Prometheus scrape jobs, alert rules, Blackbox probes, Grafana provisioning and dashboard queries.")
          PY
      - name: Validate Prometheus syntax and alert expressions with promtool
        run: |
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
      - name: Boot and smoke-test Prometheus, Blackbox Exporter and Grafana
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-test-password
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f monitoring/docker-compose.yml down -v --remove-orphans
          }
          trap cleanup EXIT
          docker compose -f monitoring/docker-compose.yml up -d
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null && curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose -f monitoring/docker-compose.yml ps
              docker compose -f monitoring/docker-compose.yml logs --no-color
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9090/api/v1/targets -o /tmp/prometheus-targets.json
          grep -q 'tayar-ai-api-metrics' /tmp/prometheus-targets.json
          grep -q 'tayar-ai-api-liveness' /tmp/prometheus-targets.json
          grep -q 'tayar-ai-api-readiness' /tmp/prometheus-targets.json
          for attempt in $(seq 1 15); do
            if curl -fsS -u "admin:$GRAFANA_ADMIN_PASSWORD" 'http://127.0.0.1:3000/api/search?query=Tayar.ai' -o /tmp/grafana-search.json; then
              if grep -q 'tayar-api-reliability' /tmp/grafana-search.json; then
                echo "Grafana dashboard is provisioned and reachable."
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose -f monitoring/docker-compose.yml logs --no-color grafana prometheus blackbox-exporter
          echo "Grafana dashboard was not provisioned within the expected time."
          exit 1
