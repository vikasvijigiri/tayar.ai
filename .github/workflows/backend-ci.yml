name: Backend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: PYTHONPATH=. pytest -q --cov=app --cov-report=term-missing
      - name: Run bounded local API concurrency smoke test
        env:
          LOAD_WORKERS: "20"
          LOAD_REQUESTS_PER_WORKER: "50"
          LOAD_P95_LIMIT_SECONDS: "2.0"
        run: python scripts/load_smoke.py
      - name: Validate Supabase schema and starter seed in PostgreSQL
        run: |
          set -euo pipefail
          docker run --detach --name tayar-seed-test -e POSTGRES_PASSWORD=ci-only-password -p 54329:5432 postgres:17
          cleanup() { docker rm -f tayar-seed-test >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if docker exec tayar-seed-test pg_isready -U postgres >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs tayar-seed-test; exit 1; fi
            sleep 2
          done
          docker exec tayar-seed-test psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth; CREATE TABLE auth.users (id uuid PRIMARY KEY); CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role; CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS 'SELECT NULL::uuid';"
          docker exec -i tayar-seed-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/schema.sql
          docker exec -i tayar-seed-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/seed_verified_math.sql
          docker exec -i tayar-seed-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/seed_verified_math.sql
          docker exec -i tayar-seed-test psql -U postgres -v ON_ERROR_STOP=1 < supabase/seed_assertions.sql
