name: Android APK
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - name: TypeScript type check
        run: npm run typecheck
      - name: Mobile source smoke tests
        run: npm test
      - run: npx expo prebuild --platform android --non-interactive
      - name: Build installable release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Enforce APK size ceiling and report sizes
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          bytes=$(stat -c%s "$apk")
          echo "APK_BYTES=$bytes" >> "$GITHUB_ENV"
          du -h "$apk"
          if [ "$bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "APK exceeds the 100 MiB product ceiling"
            exit 1
          fi
      - name: Build Play Store Android App Bundle
        run: cd android && ./gradlew bundleRelease
      - name: Report Play Store bundle size
        run: du -h android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: tayar-ai-android-release
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Attach release files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
