name: Android APK
on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build optimized Android APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: TypeScript type check
        run: npm run typecheck
      - name: Mobile source smoke tests
        run: npm test
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build optimized release APK
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Sign sideloadable candidate APK with one-time test key
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          # Ephemeral signing is for private testing only. It is intentionally not
          # reusable for future upgrades and is never uploaded or committed.
          keystore="$RUNNER_TEMP/tayar-candidate.jks"
          signing_password="$(openssl rand -base64 36)"
          keytool -genkeypair -noprompt \
            -keystore "$keystore" \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias tayar-candidate \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=Tayar.ai Test Candidate, OU=QA, O=Tayar.ai, L=Nizamabad, ST=Telangana, C=IN"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" sign --ks "$keystore" --ks-key-alias tayar-candidate \
            --ks-pass "pass:$signing_password" --key-pass "pass:$signing_password" "$apk"
          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f "$keystore"
          unset signing_password

      - name: Verify signed APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          bytes=$(stat -c%s "$apk")
          echo "APK_BYTES=$bytes" >> "$GITHUB_ENV"
          du -h "$apk"
          sha256sum "$apk" | tee android-apk-sha256.txt
          if [ "$bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "APK exceeds the 100 MiB product ceiling"
            exit 1
          fi
      - name: Build Play Store Android App Bundle
        run: cd android && ./gradlew --no-daemon bundleRelease
      - name: Verify Android App Bundle
        run: test -s android/app/build/outputs/bundle/release/app-release.aab && du -h android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK candidate, AAB and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tayar-ai-android-release-candidate
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
      # Do not publish a one-time test-signed APK or an unsigned AAB as a production release.
      # Release publication is intentionally disabled until a persistent signing key is configured.
