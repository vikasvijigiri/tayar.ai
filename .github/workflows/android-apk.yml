name: Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/quality-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimized signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      persistent_signing: ${{ steps.sign_apk.outputs.persistent_signing }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: TypeScript type check
        run: npm run typecheck

      - name: Mobile source smoke tests
        run: npm test

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/build.gradle', 'mobile/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build optimized release APK
        timeout-minutes: 20
        run: cd android && chmod +x gradlew && ./gradlew --no-daemon --console=plain --stacktrace assembleRelease

      - name: Sign APK with persistent release key or one-time QA key
        id: sign_apk
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          keystore="$RUNNER_TEMP/tayar-signing.jks"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"

          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" || -n "${ANDROID_KEYSTORE_PASSWORD:-}" || -n "${ANDROID_KEY_ALIAS:-}" || -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
              echo "Persistent signing is partially configured. Set all four ANDROID_KEYSTORE_* / ANDROID_KEY_* secrets or remove them for a QA-only build."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            "$apksigner" sign --ks "$keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" --key-pass "env:ANDROID_KEY_PASSWORD" "$apk"
            echo "persistent_signing=true" >> "$GITHUB_OUTPUT"
            echo "Signed APK with the configured persistent release key."
          else
            if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
              echo "Tagged release builds require the persistent Android signing secrets; refusing a non-upgradable release APK."
              exit 1
            fi
            # Ephemeral signing is only for private QA. Never commit or upload this key.
            signing_password="$(openssl rand -base64 36)"
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass "$signing_password" \
              -keypass "$signing_password" \
              -alias tayar-candidate \
              -keyalg RSA -keysize 3072 -validity 30 \
              -dname "CN=Tayar.ai Test Candidate, OU=QA, O=Tayar.ai, L=Nizamabad, ST=Telangana, C=IN"
            "$apksigner" sign --ks "$keystore" --ks-key-alias tayar-candidate \
              --ks-pass "pass:$signing_password" --key-pass "pass:$signing_password" "$apk"
            unset signing_password
            echo "persistent_signing=false" >> "$GITHUB_OUTPUT"
            echo "Signed APK with a one-time QA key; it is not suitable for production upgrades."
          fi

          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f "$keystore"

      - name: Verify package identity, signature and checksum
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          badging="$("$aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='ai.tayar.adaptive'"
          bytes=$(stat -c%s "$apk")
          echo "APK_BYTES=$bytes" >> "$GITHUB_ENV"
          du -h "$apk"
          digest="$(sha256sum "$apk" | awk '{print $1}')"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" | tee android-apk-sha256.txt
          if [ "$bytes" -gt $((100 * 1024 * 1024)) ]; then
            echo "APK exceeds the 100 MiB product ceiling"
            exit 1
          fi
          app_version="$(node -p "require('./app.json').expo.version")"
          printf 'app_name=Tayar.ai\napp_version=%s\npackage_id=ai.tayar.adaptive\ncommit=%s\nsigning_persistent=%s\nsha256=%s\n' \
            "$app_version" "$GITHUB_SHA" "${{ steps.sign_apk.outputs.persistent_signing }}" "$digest" > android-apk-build-info.txt
          cat android-apk-build-info.txt

      - name: Upload signed APK, checksum and provenance
        uses: actions/upload-artifact@v4
        with:
          name: tayar-ai-android-apk
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            mobile/android-apk-sha256.txt
            mobile/android-apk-build-info.txt
          if-no-files-found: error
          retention-days: 30
