name: Generate Mobile Lockfile

on:
  push:
    branches: ["build/reproducible-mobile"]
    paths:
      - ".github/workflows/generate-mobile-lock.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate lockfile without executing dependency scripts
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "build: add reproducible mobile npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
